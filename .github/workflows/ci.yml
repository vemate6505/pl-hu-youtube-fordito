name: MORDO-PLHU teszt

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mordo-plhu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Automatikus tesztek
        run: bash scripts/test.sh
      - name: Külső transcript-végpont diagnosztika
        run: bash scripts/diagnose.sh
