<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PL → HU YouTube Fordító v0.3</title>
<style>
:root{color-scheme:dark;--bg:#0d0f12;--card:#181b21;--line:#343943;--text:#f4f5f7;--muted:#b9bec8;--green:#66e6a3;--red:#ff7373}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:760px;margin:auto;padding:22px 18px 50px} h1{font-size:34px;line-height:1.05;margin:0 0 24px} small{font-size:.48em;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:22px;margin:0 0 20px}
input,button{font:inherit;border-radius:18px} input{width:100%;padding:17px;background:#101217;border:1px solid #414650;color:white;font-size:18px}
button{margin-top:14px;padding:15px 20px;border:0;background:#777;color:#fff;font-weight:800;font-size:17px}
button.secondary{background:#2c7a57} .muted{color:var(--muted);line-height:1.55}
.player{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:25px;background:#000;margin-bottom:20px}
iframe{width:100%;height:100%;border:0}.overlay{position:absolute;left:4%;right:4%;bottom:8%;text-align:center;font-size:clamp(22px,5vw,38px);font-weight:900;text-shadow:0 2px 6px #000;background:#0009;border-radius:12px;padding:6px 10px;pointer-events:none}
.good{color:var(--green)}.bad{color:var(--red)}pre{white-space:pre-wrap;word-break:break-word;background:#101217;padding:14px;border-radius:14px;max-height:300px;overflow:auto;font-size:13px}
</style>
</head>
<body><main>
<h1>🇵🇱 → 🇭🇺 YouTube<br>Fordító <small>v0.3</small></h1>
<section class="card">
<input id="url" value="https://youtu.be/RWKjvaV_rv4" aria-label="YouTube URL">
<button id="load">Videó betöltése</button>
<p class="muted">v0.3: a működő HTTPS lejátszó mellé lengyel transcript-diagnosztikát tesztelünk.</p>
</section>
<div class="player">
<iframe id="yt" src="https://www.youtube.com/embed/RWKjvaV_rv4?playsinline=1&rel=0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
<div class="overlay" id="overlay">Magyar fordítás itt fog megjelenni.</div>
</div>
<section class="card">
<h2>🇵🇱 Feliratmotor teszt</h2>
<button class="secondary" id="test">Lengyel felirat tesztelése</button>
<p id="status" class="muted">Még nem futott teszt.</p>
<pre id="out">A válasz első része itt jelenik meg.</pre>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
function videoId(s){
 s=(s||'').trim();
 if(/^[\w-]{11}$/.test(s)) return s;
 try{
   const u=new URL(s);
   if(u.hostname.includes('youtu.be')) return u.pathname.split('/').filter(Boolean)[0];
   if(u.searchParams.get('v')) return u.searchParams.get('v');
   const p=u.pathname.split('/').filter(Boolean);
   const i=p.findIndex(x=>['embed','shorts','live'].includes(x));
   if(i>=0&&p[i+1]) return p[i+1];
 }catch(e){}
 return null;
}
$('load').onclick=()=>{
 const id=videoId($('url').value);
 if(!id){$('status').innerHTML='<span class="bad">Nem ismertem fel a YouTube-linket.</span>';return}
 $('yt').src=`https://www.youtube.com/embed/${id}?playsinline=1&rel=0`;
};
$('test').onclick=async()=>{
 const id=videoId($('url').value);
 if(!id){$('status').innerHTML='<span class="bad">Hibás YouTube-link.</span>';return}
 $('status').textContent='Lengyel transcript lekérése…';
 $('out').textContent='Várakozás…';
 // Prototype-only diagnostic endpoint. If its public API changes/fails,
 // the error is shown instead of breaking the YouTube player.
 const endpoint=`https://youtube-transcript.ai/api/transcript?videoId=${encodeURIComponent(id)}&lang=pl`;
 try{
   const r=await fetch(endpoint,{headers:{'Accept':'application/json'}});
   const raw=await r.text();
   if(!r.ok) throw new Error(`HTTP ${r.status}: ${raw.slice(0,500)}`);
   let data; try{data=JSON.parse(raw)}catch{data=raw}
   $('status').innerHTML='<span class="good">✓ A transcript-végpont válaszolt.</span> Nézd meg lent, kaptunk-e valódi lengyel, időzített feliratot.';
   $('out').textContent=typeof data==='string'?data.slice(0,5000):JSON.stringify(data,null,2).slice(0,5000);
 }catch(e){
   $('status').innerHTML='<span class="bad">✗ A transcript lekérése nem sikerült.</span> A videó ettől továbbra is működik.';
   $('out').textContent=String(e);
 }
};
</script>
</body></html>
