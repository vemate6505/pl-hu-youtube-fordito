<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>PL → HU YouTube Fordító v0.6</title>
  <style>
    :root{color-scheme:dark;--bg:#0b0d10;--card:#171a20;--line:#343943;--muted:#b9bec8;--green:#2f8b66;--red:#ff747d}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    main{max-width:760px;margin:auto;padding:28px 18px 60px} h1{font-size:clamp(34px,8vw,64px);line-height:1.05;margin:12px 0 34px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:24px;margin:0 0 26px}
    input,button{width:100%;font:inherit;border-radius:20px;padding:18px;border:1px solid var(--line)} button:disabled{opacity:.55}
    input{background:#101217;color:#fff;font-size:18px} button{margin-top:16px;background:var(--green);color:#fff;font-weight:800;font-size:18px;border:0}
    .note{color:var(--muted);line-height:1.6}.player{position:relative;aspect-ratio:16/9;border-radius:26px;overflow:hidden;background:#000;margin-bottom:26px}
    iframe,#player{width:100%;height:100%;border:0}.overlay{position:absolute;z-index:3;left:3%;right:3%;bottom:12%;text-align:center;font-size:clamp(18px,4.5vw,34px);font-weight:900;line-height:1.22;text-shadow:0 2px 4px #000,0 0 8px #000;padding:8px 12px;pointer-events:none;color:#fff;background:#000b;border-radius:12px}
    h2{font-size:30px;margin:8px 0 20px}.status{margin-top:18px;line-height:1.5}.ok{color:#66d6a6}.err{color:var(--red)}
    pre{white-space:pre-wrap;word-break:break-word;background:#0d0f13;border-radius:18px;padding:16px;max-height:360px;overflow:auto;font-size:13px}
  </style>
</head>
<body><main>
  <h1>🇵🇱 → 🇭🇺 YouTube<br>Fordító <small style="font-size:.45em">v0.6</small></h1>
  <section class="card">
    <input id="url" value="https://youtu.be/RWKjvaV_rv4" aria-label="YouTube URL">
    <button id="load">Videó betöltése</button>
    <p class="note">v0.6: a lengyel transcript automatikus magyar fordítása és időzített megjelenítése a videón.</p>
  </section>

  <div class="player">
    <div id="player"></div>
    <div id="overlay" class="overlay">A magyar felirat indításra vár.</div>
  </div>

  <section class="card">
    <h2>🇭🇺 Magyar felirat</h2>
    <button id="translate">Magyar felirat elkészítése</button>
    <div id="status" class="status note">Még nem indítottunk tesztet.</div>
    <pre id="out">A magyar fordítás itt jelenik meg.</pre>
  </section>
</main>
<script src="app.js"></script></body></html>
