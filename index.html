<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>PL → HU YouTube Fordító v0.4</title>
  <style>
    :root{color-scheme:dark;--bg:#0b0d10;--card:#171a20;--line:#343943;--muted:#b9bec8;--green:#2f8b66;--red:#ff747d}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    main{max-width:760px;margin:auto;padding:28px 18px 60px} h1{font-size:clamp(34px,8vw,64px);line-height:1.05;margin:12px 0 34px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:24px;margin:0 0 26px}
    input,button{width:100%;font:inherit;border-radius:20px;padding:18px;border:1px solid var(--line)}
    input{background:#101217;color:#fff;font-size:18px} button{margin-top:16px;background:var(--green);color:#fff;font-weight:800;font-size:18px;border:0}
    .note{color:var(--muted);line-height:1.6}.player{position:relative;aspect-ratio:16/9;border-radius:26px;overflow:hidden;background:#000;margin-bottom:26px}
    iframe{width:100%;height:100%;border:0}.overlay{position:absolute;left:0;right:0;bottom:8%;text-align:center;font-size:clamp(20px,5vw,38px);font-weight:900;text-shadow:0 2px 4px #000,0 0 8px #000;padding:0 18px;pointer-events:none}
    h2{font-size:30px;margin:8px 0 20px}.status{margin-top:18px;line-height:1.5}.ok{color:#66d6a6}.err{color:var(--red)}
    pre{white-space:pre-wrap;word-break:break-word;background:#0d0f13;border-radius:18px;padding:16px;max-height:360px;overflow:auto;font-size:13px}
  </style>
</head>
<body><main>
  <h1>🇵🇱 → 🇭🇺 YouTube<br>Fordító <small style="font-size:.45em">v0.4</small></h1>
  <section class="card">
    <input id="url" value="https://youtu.be/RWKjvaV_rv4" aria-label="YouTube URL">
    <button id="load">Videó betöltése</button>
    <p class="note">v0.4: a működő HTTPS lejátszó mellett a javított lengyel transcript-végpontot teszteljük.</p>
  </section>

  <div class="player">
    <iframe id="player" src="https://www.youtube.com/embed/RWKjvaV_rv4?playsinline=1&rel=0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
    <div class="overlay">Magyar fordítás itt fog megjelenni.</div>
  </div>

  <section class="card">
    <h2>🇵🇱 Feliratmotor teszt</h2>
    <button id="test">Lengyel felirat tesztelése</button>
    <div id="status" class="status note">Még nem indítottunk tesztet.</div>
    <pre id="out">A lengyel transcript eredménye itt jelenik meg.</pre>
  </section>
</main>
<script>
  let videoId = "RWKjvaV_rv4";
  const $ = id => document.getElementById(id);

  function getId(v){
    v=(v||"").trim();
    if(/^[\w-]{11}$/.test(v)) return v;
    try{
      const u=new URL(v);
      if(u.hostname.includes("youtu.be")) return u.pathname.split("/").filter(Boolean)[0];
      if(u.searchParams.get("v")) return u.searchParams.get("v");
      const p=u.pathname.split("/").filter(Boolean);
      const i=p.findIndex(x=>["embed","shorts","live"].includes(x));
      if(i>=0 && p[i+1]) return p[i+1];
    }catch(e){}
    return null;
  }

  $("load").onclick=()=>{
    const id=getId($("url").value);
    if(!id){ $("status").className="status err"; $("status").textContent="✗ Nem sikerült felismerni a YouTube videóazonosítót."; return; }
    videoId=id;
    $("player").src=`https://www.youtube.com/embed/${id}?playsinline=1&rel=0`;
    $("status").className="status note";
    $("status").textContent="Videó betöltve. Indítható a lengyel feliratteszt.";
  };

  $("test").onclick=async()=>{
    const id=getId($("url").value)||videoId;
    const endpoint=`https://youtube-transcript.ai/transcript/${encodeURIComponent(id)}.txt?lang=pl`;
    $("status").className="status note";
    $("status").textContent="⏳ Lengyel transcript lekérése…";
    $("out").textContent=`Lekérés: ${endpoint}`;
    try{
      const r=await fetch(endpoint,{headers:{"Accept":"text/plain"}});
      const text=await r.text();
      if(!r.ok) throw new Error(`HTTP ${r.status} ${r.statusText}\n${text.slice(0,1000)}`);
      if(!text.trim()) throw new Error("A szolgáltatás üres választ adott.");
      $("status").className="status ok";
      $("status").textContent="✓ Transcript válasz megérkezett. Nézd meg lent a lengyel szöveget/időbélyegeket.";
      $("out").textContent=text;
    }catch(e){
      $("status").className="status err";
      $("status").textContent="✗ A transcript lekérése nem sikerült. A videó ettől továbbra is működik.";
      $("out").textContent=String(e && (e.stack||e.message) || e);
    }
  };
</script></body></html>
